<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musical Terms Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=97472ca">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>Musical Terms Quiz</h1>
        <p class="subtitle">Italian, French and German vocabulary for Grades 1-8.</p>
      </div>
    </header>

    <section id="setupPanel" class="controls card">
      <div class="sectionHeading">
        <div>
          <h2>Create your practice set</h2>
          <p>Choose a level, coverage and direction.</p>
        </div>
      </div>

      <div class="setupGrid">
        <div class="field">
          <label for="gradeSelect">Grade</label>
          <select id="gradeSelect">
            <option value="1">Grade 1</option>
            <option value="2">Grade 2</option>
            <option value="3">Grade 3</option>
            <option value="4">Grade 4</option>
            <option value="5" selected>Grade 5</option>
            <option value="6">Grade 6</option>
            <option value="7">Grade 7</option>
            <option value="8">Grade 8</option>
          </select>
        </div>
        <div class="field">
          <label for="scopeSelect">Coverage</label>
          <select id="scopeSelect">
            <option value="cumulative">Include previous grades</option>
            <option value="grade-only">Selected grade only</option>
          </select>
        </div>
        <div class="field">
          <label for="modeSelect">Direction</label>
          <select id="modeSelect">
            <option value="term-en">Term to English</option>
            <option value="en-term">English to term</option>
            <option value="mixed">Mixed</option>
          </select>
        </div>
        <div class="field">
          <label for="questionCountSelect">Questions</label>
          <select id="questionCountSelect"></select>
        </div>
      </div>

      <div class="setupFooter">
        <p id="termCount" class="termCount" aria-live="polite"></p>
        <button id="startBtn" class="btn primary">Start quiz <span aria-hidden="true">→</span></button>
      </div>
    </section>

    <section id="status" class="status hidden" aria-label="Quiz status">
      <span id="quizContext" class="contextChip"></span>
      <div class="statusItem">
        <span class="statusLabel">Progress</span>
        <strong id="progress">Question 0/0</strong>
      </div>
      <div class="statusItem statusScore">
        <span class="statusLabel">Current score</span>
        <strong id="score">Score: 0</strong>
      </div>
    </section>
    <div id="progressWrap" class="progressWrap hidden" aria-label="Quiz progress">
      <div id="progressFill" class="progressFill"></div>
    </div>

    <section id="card" class="card hidden">
      <div class="questionMeta">
        <p id="promptType" class="promptType"></p>
        <div class="metaChips">
          <span id="questionLanguage" class="languageChip"></span>
          <span id="questionGrade" class="gradeChip"></span>
        </div>
      </div>
      <h2 id="term"></h2>
      <div id="choices" class="choices"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <div class="actions">
        <button id="skipBtn" class="btn ghost">Skip</button>
        <button id="nextBtn" class="btn primary" disabled>Next <span aria-hidden="true">→</span></button>
        <button id="endBtn" class="btn textDanger">End quiz</button>
      </div>
    </section>

    <section id="done" class="card hidden">
      <div class="doneHeading">
        <span class="doneIcon" aria-hidden="true">✓</span>
        <div>
          <p class="eyebrow">Session finished</p>
          <h2>Quiz complete</h2>
        </div>
      </div>
      <p id="finalScore" class="finalScore"></p>
      <div id="scoreBreakdown"></div>
      <button id="restartBtn" class="btn primary">Create another quiz</button>
    </section>

    <p id="error" class="error hidden"></p>
    <footer class="footer"><small>Built by Jordan Tan</small></footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
